<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>散步</title>
<style>
  :root{
    --paper:#F2EDE3;      /* 米色底 */
    --paper-2:#E5DDCD;    /* 次级面 */
    --line:#CFC4AE;       /* 描边 */
    --ink:#2E3428;        /* 深橄榄黑，正文 */
    --ink-dim:#7A7A68;    /* 次级文字 */
    --moss:#5A6B47;       /* 苔藓绿，唯一强调色 */
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --cjk:"PingFang SC","Noto Sans CJK SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--cjk);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  /* 每一屏都是满屏，不滚动 */
  .screen{
    position:fixed;inset:0;
    display:none;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 28px);
    background:var(--paper);
  }
  .screen.on{display:flex;animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .label{
    font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-dim);
  }
  .spacer{flex:1}

  h1{font-size:34px;font-weight:600;letter-spacing:.02em;line-height:1.35}
  h2{font-size:26px;font-weight:600;line-height:1.4}
  .sub{color:var(--ink-dim);margin-top:14px;font-size:15px}

  button{
    font-family:var(--cjk);font-size:16px;font-weight:500;
    border:1px solid var(--ink);background:transparent;color:var(--ink);
    padding:15px 24px;width:100%;cursor:pointer;border-radius:0;
    transition:background .15s,color .15s;
  }
  button:active{background:var(--ink);color:var(--paper)}
  button:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
  .solid{background:var(--ink);color:var(--paper)}
  .solid:active{opacity:.75}
  .ghost{border-color:var(--line);color:var(--ink-dim);font-size:14px;padding:12px}
  .stack{display:flex;flex-direction:column;gap:10px}

  /* ---------- 取景屏 ---------- */
  #camScreen{padding-left:0;padding-right:0}
  .cam-task{padding:0 22px;margin-bottom:16px}
  .cam-task .label{color:var(--moss)}
  .cam-task p{font-size:20px;font-weight:500;line-height:1.45;margin-top:6px}

  .viewfinder{
    position:relative;width:100%;aspect-ratio:1;
    background:var(--paper-2);overflow:hidden;
  }
  .viewfinder video,.viewfinder canvas{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  /* 取景框四角 */
  .corner{position:absolute;width:22px;height:22px;border:2px solid rgba(242,237,227,.9)}
  .c1{top:12px;left:12px;border-right:0;border-bottom:0}
  .c2{top:12px;right:12px;border-left:0;border-bottom:0}
  .c3{bottom:12px;left:12px;border-right:0;border-top:0}
  .c4{bottom:12px;right:12px;border-left:0;border-top:0}
  .cam-msg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:28px;color:var(--ink-dim);font-size:14px;line-height:1.6;
  }

  /* 快门 */
  .shutter-row{
    display:flex;align-items:center;justify-content:center;gap:26px;
    padding:0 22px;margin-top:26px;
  }
  .shutter{
    width:74px;height:74px;border-radius:50%;
    border:2px solid var(--ink);background:var(--paper);
    padding:0;flex:0 0 auto;position:relative;
  }
  .shutter::after{
    content:"";position:absolute;inset:6px;border-radius:50%;
    background:var(--ink);transition:transform .12s;
  }
  .shutter:active::after{transform:scale(.86)}
  .shutter:active{background:var(--paper)}
  .side{
    flex:0 0 74px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    color:var(--ink-dim);text-align:center;border:0;padding:6px;background:none;
  }
  .side:active{background:none;color:var(--ink)}
  .side.hidden{visibility:hidden}

  /* ---------- 回看屏 ---------- */
  .shot-wrap{width:100%;aspect-ratio:1;overflow:hidden;background:var(--paper-2)}
  .shot-wrap img{width:100%;height:100%;object-fit:cover;display:block;
    animation:dev .8s ease-out both}
  @keyframes dev{from{filter:saturate(.2) brightness(1.15);opacity:.5}to{filter:none;opacity:1}}
  .reply{
    margin-top:20px;font-size:17px;line-height:1.6;
    border-left:2px solid var(--moss);padding-left:14px;
  }
  .reply.pending{color:var(--ink-dim);font-family:var(--mono);font-size:12px;
    letter-spacing:.12em;border-left-color:var(--line)}

  /* ---------- 卡片屏 ---------- */
  #cardScreen{overflow-y:auto;display:none}
  #cardScreen.on{display:block}
  .card-date{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink-dim)}
  .row{display:flex;gap:14px;margin-top:20px}
  .row img{flex:0 0 88px;height:88px;object-fit:cover;border:1px solid var(--line)}
  .row .t{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-dim);display:block;margin-bottom:5px}
  .row p{font-size:15px;line-height:1.5}
  .summary{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:17px;line-height:1.6}

  /* ---------- key ---------- */
  details{margin-top:18px}
  summary{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-dim);
    cursor:pointer;list-style:none;padding:8px 0}
  summary::-webkit-details-marker{display:none}
  details input{
    width:100%;background:var(--paper-2);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:12px;padding:11px;
  }
  details p{font-size:12px;color:var(--ink-dim);margin-top:8px;line-height:1.5}

  /* ---------- 首页的小家伙 ----------
     四只轮着出现，全是手写 SVG，不引任何外部图片。
     小家伙轻轻起伏，脚下虚线往后滑 = 看着像在往前走。 */
  .mascot{margin-bottom:22px}
  .mascot svg{width:138px;height:115px;display:block;color:var(--ink)}
  .mascot .fig{animation:bob 1.5s ease-in-out infinite}
  .mascot .ground{color:var(--line);animation:walkline 1.5s linear infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes walkline{to{stroke-dashoffset:-14}}

  /* ---------- 存档屏 ---------- */
  #archive,#walkDetail{overflow-y:auto}
  #archiveBody{flex:1;display:flex;flex-direction:column}
  .empty{margin:auto 0;text-align:center}
  .empty p{font-size:17px}
  .empty .hint{font-size:13px;color:var(--ink-dim);margin-top:12px;line-height:1.8}

  .arch-stat{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    color:var(--ink-dim);margin:18px 0 2px}
  .arch-row{
    display:block;width:100%;text-align:left;background:none;
    border:0;border-top:1px solid var(--line);padding:18px 0;
  }
  .arch-row:active{background:none;color:var(--ink);opacity:.55}
  .arch-thumbs{display:flex;gap:8px;margin-top:10px}
  .arch-thumbs img,.arch-thumbs .ph{
    flex:0 0 auto;width:78px;height:78px;object-fit:cover;display:block;
    border:1px solid var(--line);background:var(--paper-2);
  }
  .arch-sum{display:block;margin-top:12px;font-size:14px;line-height:1.55;color:var(--ink)}

  /* ---------- 这阵子（跨时间观察） ---------- */
  #observe{overflow-y:auto}
  .obs-btn{margin-top:20px;font-size:14px;padding:13px}
  .obs-block{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
  .obs-h{font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-dim);margin-bottom:16px}
  .obs-fact{display:flex;justify-content:space-between;gap:16px;
    font-size:15px;line-height:1.7;padding:5px 0}
  .obs-fact b{font-weight:600;font-variant-numeric:tabular-nums}
  .obs-note{font-size:13px;color:var(--ink-dim);line-height:1.7;margin-top:14px}
  .obs-ai .line{font-size:17px;line-height:1.65;border-left:2px solid var(--moss);
    padding-left:15px;margin-bottom:18px}
  .obs-lock{font-size:14px;color:var(--ink-dim);line-height:1.8}
  .obs-when{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    color:var(--ink-dim);margin-top:6px}

  /* ---------- 某一趟的详情 ---------- */
  .det-back{width:auto;align-self:flex-start;padding:9px 15px;margin-bottom:20px}
  .det-shot{margin-top:28px}
  .det-shot .t{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    color:var(--ink-dim);display:block;margin-top:13px}
  .det-shot .reply{margin-top:10px;font-size:16px}

  /* ---------- 底栏 ----------
     只在「欢迎 / 存档 / 结束卡片」三屏出现。
     走路途中收起来 —— 那时候不该有别的地方可去。 */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    display:none;background:var(--paper);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar.on{display:flex}
  .tabbar button{
    flex:1;position:relative;border:0;background:none;
    padding:15px 0 16px;font-size:14px;letter-spacing:.28em;
    color:var(--ink-dim);transition:color .15s;
  }
  .tabbar button:active{background:none;color:var(--ink)}
  .tabbar button.sel{color:var(--ink)}
  .tabbar button.sel::before{
    content:"";position:absolute;top:-1px;left:0;right:0;height:2px;background:var(--moss);
  }
  /* 有底栏的屏，底部留出空间，内容别被压住 */
  #welcome,#archive,#observe,#walkDetail{padding-bottom:calc(env(safe-area-inset-bottom) + 80px)}
  .card-inner{padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 92px)}

  /* 选哪家模型 */
  .pick{display:flex;gap:8px;margin-bottom:10px}
  .pick button{
    flex:1;padding:10px;font-size:13px;width:auto;
    border:1px solid var(--line);color:var(--ink-dim);background:transparent;
  }
  .pick button.sel{border-color:var(--ink);color:var(--ink);background:var(--paper-2)}
  .pick button:active{background:var(--paper-2);color:var(--ink)}

  input[type=file]{display:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 1 欢迎 -->
<section class="screen on" id="welcome">
  <span class="label">散步</span>
  <div class="spacer"></div>
  <div class="mascot" id="mascot"></div>
  <h1>准备好<br>今天这趟走路了吗</h1>
  <p class="sub">三个任务，一次一个。<br>大概二十分钟，走到哪算哪。</p>
  <div class="spacer"></div>
  <button class="solid" id="btnStart">开始</button>
  <details>
    <summary id="keyLabel">AI 点评：未开启</summary>
    <div class="pick" id="pickProvider">
      <button data-p="anthropic">Claude</button>
      <button data-p="deepseek">DeepSeek</button>
    </div>
    <input type="password" id="keyInput" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
    <p>填了才有点评。留空也能走，就是安静地拍照。<br>
       两家的 key 分开记着，来回切不用重填。<br>
       key 只存在这台手机上，不会上传到任何地方。</p>
  </details>
</section>

<!-- 2 任务过场 -->
<section class="screen" id="intro">
  <span class="label" id="introLabel"></span>
  <div class="spacer"></div>
  <h2 id="introText"></h2>
  <div class="spacer"></div>
  <button class="solid" id="btnGo">看任务</button>
</section>

<!-- 3 取景 -->
<section class="screen" id="camScreen">
  <div class="cam-task">
    <span class="label" id="camRound"></span>
    <p id="camTask"></p>
  </div>
  <div class="viewfinder" id="vf">
    <video id="video" playsinline muted autoplay></video>
    <span class="corner c1"></span><span class="corner c2"></span>
    <span class="corner c3"></span><span class="corner c4"></span>
    <div class="cam-msg" id="camMsg" style="display:none"></div>
  </div>
  <div class="shutter-row">
    <button class="side" id="btnSwap">换一个</button>
    <button class="shutter" id="btnShoot" aria-label="拍照"></button>
    <button class="side" id="btnZoom">1×</button>
  </div>
  <input type="file" accept="image/*" capture="environment" id="picker">
</section>

<!-- 4 回看 -->
<section class="screen" id="review">
  <span class="label" id="revRound"></span>
  <div class="spacer"></div>
  <div class="shot-wrap"><img id="revImg" alt=""></div>
  <div class="reply" id="revReply"></div>
  <div class="spacer"></div>
  <div class="stack">
    <button class="solid" id="btnNext"></button>
    <button class="ghost" id="btnRetake">重拍</button>
  </div>
</section>

<!-- 5 卡片 -->
<section class="screen" id="cardScreen">
  <div class="card-inner">
    <span class="card-date" id="cardDate"></span>
    <h2 style="margin-top:8px">这趟散步</h2>
    <div id="cardRows"></div>
    <div class="summary" id="cardSum"></div>
    <button class="ghost" id="btnAgain" style="margin-top:28px">再走一趟</button>
  </div>
</section>

<!-- 6 存档（第四节接 IndexedDB，现在是空壳） -->
<section class="screen" id="archive">
  <span class="label">存档</span>
  <div id="archiveBody"></div>
  <details id="backup">
    <summary>备份 / 恢复</summary>
    <div class="stack" style="margin-top:12px">
      <button class="ghost" id="btnExport">导出备份</button>
      <button class="ghost" id="btnImport">从备份恢复</button>
    </div>
    <p>照片只存在这台手机上。换手机、清了浏览器数据、或者 iOS 隔一阵子自己
       回收掉，就都没了。导出一个文件存到「文件」App 或者发给自己，是唯一的保险。<br><br>
       恢复是合并，不会覆盖掉现在已有的。</p>
    <input type="file" accept="application/json,.json" id="importFile">
  </details>
</section>

<!-- 7 这阵子 -->
<section class="screen" id="observe">
  <button class="ghost det-back" id="btnBackArch2">← 存档</button>
  <span class="label">这阵子</span>
  <div id="obsNumbers"></div>
  <div class="obs-block obs-ai" id="obsAI"></div>
</section>

<!-- 8 某一趟的详情 -->
<section class="screen" id="walkDetail">
  <button class="ghost det-back" id="btnBackArch">← 存档</button>
  <span class="card-date" id="detDate"></span>
  <div id="detRows"></div>
  <div class="summary" id="detSum"></div>
  <button class="ghost" id="btnDelWalk" style="margin-top:34px">删掉这趟</button>
</section>

<!-- 底栏 -->
<nav class="tabbar" id="tabbar">
  <button data-tab="walk"    id="tabWalk"    class="sel">走</button>
  <button data-tab="archive" id="tabArchive">存档</button>
</nav>

<script>
/* =========================================================
   1. 任务池 —— 顺序就是难度：找茬（易）→ 出洋相（中）→ 发呆（难）

   题目本身不在这里，在同目录的 tasks.json 里。
   想改题、加题、改措辞，编辑那个文件就行，不用动代码。
   ========================================================= */

/* 读不到 tasks.json 时的兜底：断网，或者直接双击打开 html
   （file:// 协议下浏览器不允许 fetch）。每组留一条，保证 App
   永远走得完，不会白屏。跟下面摄像头那个兜底一个道理，别删。 */
const FALLBACK = { groups:[
  { name:"找茬",   tasks:["拍一处有人手写的字"] },
  { name:"出洋相", tasks:["蹲下来，拍一样离地面不到 20 厘米的东西"] },
  { name:"发呆",   tasks:["拍一样看起来比你老的东西"] }
]};

let POOL={}, ROUNDS=[];
const ORDINAL=["第一个","第二个","第三个","第四个","第五个"];

async function loadTasks(){
  let data=FALLBACK;
  try{
    /* 加时间戳绕开手机缓存 —— 改完题目要立刻生效，不能拿到旧的 */
    const r=await fetch("tasks.json?v="+Date.now());
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    const ok = Array.isArray(j.groups) && j.groups.length
      && j.groups.every(g=>g.name && Array.isArray(g.tasks) && g.tasks.length);
    if(!ok) throw new Error("tasks.json 格式不对");
    data=j;
  }catch(err){
    console.warn("题库没读到，用兜底的：",err.message);
  }
  ROUNDS = data.groups.map(g=>g.name);
  POOL   = Object.fromEntries(data.groups.map(g=>[g.name,g.tasks]));
}

/* =========================================================
   1b. 首页的小家伙
   四只轮着来：走路的人 → 小狗 → 鸭子 → 人遛狗 → 循环。
   全部是手写 SVG，不引任何外部图片和图标库（见交接文档约束 2）。
   身子和头用 --paper 填充，是为了让重叠处的线不互相穿过去。
   ========================================================= */
const MASCOTS = [

/* 走路的人 */
`<g class="fig">
  <path d="M50 11 Q54 4 59 10"/>
  <circle cx="58" cy="21" r="13" fill="var(--paper)"/>
  <path d="M57 34 L54 59"/>
  <path d="M56 41 L41 51"/><path d="M56 41 L70 47"/>
  <path d="M54 59 L42 87"/><path d="M42 87 L34 88"/>
  <path d="M54 59 L68 85"/><path d="M68 85 L76 88"/>
</g>`,

/* 小狗 */
`<g class="fig">
  <path d="M34 53 Q23 46 27 33"/>
  <rect x="34" y="45" width="44" height="24" rx="12" fill="var(--paper)"/>
  <path d="M44 69 L42 88"/><path d="M56 69 L58 88"/>
  <path d="M68 69 L66 88"/><path d="M76 67 L80 88"/>
  <circle cx="88" cy="43" r="13" fill="var(--paper)"/>
  <path d="M81 33 Q72 39 76 51 Q84 49 85 38 Z" fill="var(--paper)"/>
  <path d="M99 46 L107 47"/>
  <circle cx="93" cy="40" r="2" fill="currentColor" stroke="none"/>
</g>`,

/* 鸭子 */
`<g class="fig">
  <path d="M32 54 L20 47"/>
  <ellipse cx="53" cy="61" rx="24" ry="17" fill="var(--paper)"/>
  <path d="M43 55 Q59 61 51 73"/>
  <path d="M47 78 L45 88"/><path d="M39 88 L52 88"/>
  <path d="M59 78 L61 88"/><path d="M55 88 L68 88"/>
  <circle cx="79" cy="38" r="13" fill="var(--paper)"/>
  <path d="M90 36 L101 34 L101 42 Z" fill="var(--moss)" stroke="var(--moss)"/>
  <circle cx="83" cy="34" r="2" fill="currentColor" stroke="none"/>
</g>`,

/* 人遛狗 */
`<g class="fig">
  <circle cx="34" cy="25" r="11" fill="var(--paper)"/>
  <path d="M33 36 L31 60"/>
  <path d="M33 42 L22 52"/><path d="M33 42 L46 50"/>
  <path d="M31 60 L21 88"/><path d="M21 88 L14 88"/>
  <path d="M31 60 L43 86"/><path d="M43 86 L50 88"/>
  <path d="M46 50 Q72 64 98 53" stroke="var(--moss)" stroke-width="2.4"/>
  <path d="M72 63 Q65 57 68 49"/>
  <rect x="72" y="58" width="28" height="17" rx="8.5" fill="var(--paper)"/>
  <path d="M78 75 L77 88"/><path d="M86 75 L88 88"/>
  <path d="M94 75 L92 88"/><path d="M99 74 L103 88"/>
  <circle cx="105" cy="55" r="9" fill="var(--paper)"/>
  <path d="M100 48 Q94 52 97 60 Q102 59 103 51 Z" fill="var(--paper)"/>
  <path d="M113 57 L118 58"/>
  <circle cx="108" cy="53" r="1.7" fill="currentColor" stroke="none"/>
</g>`

];

/* 轮换：记着上次是第几只，下次换下一只 */
(function drawMascot(){
  let n = 0;
  try{ n = (parseInt(localStorage.getItem("walk_mascot"),10) || 0) % MASCOTS.length; }catch{}
  try{ localStorage.setItem("walk_mascot", String((n+1) % MASCOTS.length)); }catch{}
  document.getElementById("mascot").innerHTML =
    `<svg viewBox="0 0 124 100" fill="none" stroke="currentColor" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">`
    + MASCOTS[n]
    + `<path class="ground" d="M6 93 L118 93" stroke-dasharray="5 9"/></svg>`;
})();

/* =========================================================
   2. 状态
   ========================================================= */
let tasks=[], idx=0, swapsLeft=1;

function reset(){
  tasks = ROUNDS.map(r=>({
    round:r,
    text:POOL[r][Math.floor(Math.random()*POOL[r].length)],

/* =========================================================
   5. 摄像头
   getUserMedia 只在 HTTPS 或 localhost 下可用。
   调不起来就退回系统相机（点一下拍），保证不白屏。
   ========================================================= */
let stream=null, camOK=false;
const video=S("video"), camMsg=S("camMsg");

async function startCam(){
  if(stream) return;
  camMsg.style.display="none";
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("no-api");
    stream=await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:"environment"}, width:{ideal:1440}, height:{ideal:1440} },
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    camOK=true;
    S("btnZoom").style.visibility="visible";
    setZoom(1);
  }catch(err){
    camOK=false;
    S("btnZoom").style.visibility="hidden";
    video.style.display="none";
    camMsg.style.display="flex";
    camMsg.textContent = location.protocol==="https:"||location.hostname==="localhost"
      ? "摄像头没打开。点下面的快门，用系统相机拍。"
      : "实时取景需要 HTTPS。现在点快门会调系统相机。";
  }
}
function stopCam(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject=null;
}

/* ---------- 变焦 ----------
   两条路，自动选：
   1) 硬件变焦——镜头真的推近，画质不掉。iOS Safari 基本不支持。
   2) 数码变焦——画面放大，拍照时裁中间一块。到处都能用，但会损画质，
      所以上限压到 3 倍（3 倍时只用了原图中间九分之一的像素）。
   跟摄像头兜底一个思路：先问设备行不行，不行就退回能用的那条。 */
const MAX_ZOOM = 3;
let zoom = 1, hwZoom = false;

function setZoom(z){
  zoom = Math.min(MAX_ZOOM, Math.max(1, z));
  S("btnZoom").textContent = (Math.round(zoom*10)/10) + "×";

  const track = stream && stream.getVideoTracks()[0];
  const caps  = track && track.getCapabilities && track.getCapabilities();

  if(caps && caps.zoom){
    /* 各家设备的 zoom 量纲不一样（有的 1~5，有的 100~400），
       按比例映射到它自己的范围里，别硬塞我们的 1~3 */
    const r = (zoom - 1) / (MAX_ZOOM - 1);
    const v = caps.zoom.min + (caps.zoom.max - caps.zoom.min) * r;
    hwZoom = true;
    video.style.transform = "";
    track.applyConstraints({advanced:[{zoom:v}]}).catch(()=>{
      hwZoom = false;                                   // 设备说不行，退回数码
      video.style.transform = "scale(" + zoom + ")";
    });
  }else{
    hwZoom = false;
    video.style.transform = "scale(" + zoom + ")";
  }
}

/* 双指捏合，在取景框上连续调 */
const touchDist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
let pinchD0 = 0, pinchZ0 = 1;

S("vf").addEventListener("touchstart", e=>{
  if(e.touches.length===2){ pinchD0 = touchDist(e.touches); pinchZ0 = zoom; }
}, {passive:true});

S("vf").addEventListener("touchmove", e=>{
  if(e.touches.length===2 && pinchD0){
    e.preventDefault();                    // 拦住，否则整个页面跟着缩放
    setZoom(pinchZ0 * touchDist(e.touches) / pinchD0);
  }
}, {passive:false});

S("vf").addEventListener("touchend", ()=>{ pinchD0 = 0; }, {passive:true});

/* 从实时画面截一张方图 */
function grabSquare(){
  const w=video.videoWidth, h=video.videoHeight;
  const full=Math.min(w,h);
  /* 硬件变焦时镜头已经推近了，整帧就是放大后的画面，裁满即可；
     数码变焦要自己裁中间一块，裁多少由倍数决定 */
  const side=hwZoom ? full : full/zoom;
  const c=document.createElement("canvas");
  c.width=c.height=Math.min(Math.round(side),1000);
  c.getContext("2d").drawImage(video,(w-side)/2,(h-side)/2,side,side,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.85);
}

/* 系统相机拍完的文件，压到 1000px 方图 */
function shrinkFile(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("读不出这张图"));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error("这张图打不开"));
      im.onload=()=>{
        const side=Math.min(im.width,im.height);
        const c=document.createElement("canvas");
        c.width=c.height=Math.min(side,1000);
        c.getContext("2d").drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.85));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* =========================================================
   6. AI
   ========================================================= */
const VOICE=`你是用户散步时的一个朋友，嘴有点损但心是好的。用户会发来他刚拍的照片和当时的任务。

你要做的：
1. 说出照片里一个他大概率没注意到的具体细节。这是最重要的部分——不是描述他拍了什么，他自己知道；是指出他没看见的那一点。
2. 顺带损他一句，轻的。可以吐槽构图、吐槽他挑的对象、吐槽这地方，语气像熟人拌嘴。
3. 全部加起来一到两句话，最多 45 个字。中文。

绝对不许：
- 挖苦他的努力、审美或者拍照水平不行——那不是损，那是打击，他会不想拍第二张
- 只是复述照片内容
- 说教、鼓励、加感叹号堆热情
- 用"我看到"、"这张照片"开头

直接说，不要铺垫。`;

async function callAI(body){
  const P=PROVIDERS[provider];
  const headers={
    "Content-Type":"application/json",
    "x-api-key":apiKey,
    "anthropic-version":"2023-06-01"
  };
  /* 这个头是 Anthropic 特有的，用来放行浏览器直连。DeepSeek 不需要，就别发。 */
  if(provider==="anthropic") headers["anthropic-dangerous-direct-browser-access"]="true";

  const r=await fetch(P.url,{method:"POST",headers,body:JSON.stringify(body)});
  if(!r.ok) throw new Error(
    r.status===401 ? P.name+" 的 key 不对" :
    r.status===402 ? P.name+" 余额不足" :
    r.status===429 ? "太频繁了，等一下" :
    P.name+" 接口 "+r.status);
  const d=await r.json();
  return d.content.filter(b=>b.type==="text").map(b=>b.text).join("").trim();
}
const askAI=(url,text)=>callAI({
  model:PROVIDERS[provider].model,max_tokens:1000,system:VOICE,
  messages:[{role:"user",content:[
    {type:"image",source:{type:"base64",media_type:"image/jpeg",data:url.split(",")[1]}},
    {type:"text",text:"任务是："+text}
  ]}]
});
const askSummary=()=>callAI({
  model:PROVIDERS[provider].model,max_tokens:1000,
  system:VOICE+`

这趟散步结束了。看这三条记录，找一个跨照片的规律——比如他老是往上拍、老是拍旧东西、三张都没有人。说一句收尾的话，一到两句，最多 45 个字，还是那个损朋友的语气。找不出规律就说点别的，别硬凑。`,
  messages:[{role:"user",content:tasks.filter(t=>t.photo)
    .map((t,i)=>`${i+1}. 任务「${t.text}」，你当时说：${t.reply||"（没点评）"}`).join("\n")}]
});

/* =========================================================
   8. 存档（IndexedDB）

   为什么不用 localStorage：它上限 5MB，只能存文字。一张照片转成
   文字大约 250KB，存 6 趟就满了。IndexedDB 没这个限制。

   分两个仓库，是为了让时间线能秒开：
     walks  —— 一趟一条，含 240px 缩略图，约 37KB。打开存档只读这个。
     photos —— 一张大图一条，约 250KB。点进某一趟才去读。
   不拆的话，打开存档就要把几十兆全捞出来，手机会卡死。

   全程只写这台设备，不上传任何东西。
   ========================================================= */
const DB_NAME="walkapp", DB_VER=2;      // 2：加了 meta 仓库，存跨时间观察
let dbPromise=null;

function db(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res,rej)=>{
    if(!self.indexedDB) return rej(new Error("这台设备不支持 IndexedDB"));
    const q=indexedDB.open(DB_NAME,DB_VER);
    q.onupgradeneeded=()=>{
      const d=q.result;
      if(!d.objectStoreNames.contains("walks"))  d.createObjectStore("walks", {keyPath:"id"});
      if(!d.objectStoreNames.contains("photos")) d.createObjectStore("photos",{keyPath:"id"});
      if(!d.objectStoreNames.contains("meta"))   d.createObjectStore("meta",  {keyPath:"id"});
    };
    q.onsuccess=()=>res(q.result);
    q.onerror  =()=>rej(q.error||new Error("打不开本地存储"));
  });
  return dbPromise;
}

/* 一次事务一个请求，够用，也不容易写错 */
function idb(store,mode,fn){
  return db().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode);
    const r=fn(t.objectStore(store));
    t.oncomplete=()=>res(r?r.result:undefined);
    t.onerror   =()=>rej(t.error);
    t.onabort   =()=>rej(t.error||new Error("写入被中断，可能是空间满了"));
  }));
}
const idbPut = (st,v)=>idb(st,"readwrite",s=>s.put(v));
const idbGet = (st,k)=>idb(st,"readonly", s=>s.get(k));
const idbAll = st    =>idb(st,"readonly", s=>s.getAll());
const idbDel = (st,k)=>idb(st,"readwrite",s=>s.delete(k));

/* 大图压成 240px 缩略图。时间线只用它，所以要小。 */
function makeThumb(dataUrl,size=240){
  return new Promise(res=>{
    const im=new Image();
    im.onload =()=>{
      const c=document.createElement("canvas");
      c.width=c.height=size;
      c.getContext("2d").drawImage(im,0,0,size,size);
      res(c.toDataURL("image/jpeg",0.7));
    };
    im.onerror=()=>res("");          // 缩略图失败不该连累整趟存不下
    im.src=dataUrl;
  });
}

const p2=n=>String(n).padStart(2,"0");

/* 走完一趟就落盘。先存照片，别等 AI 收尾那句话。 */
async function saveWalk(){
  const shot=tasks.filter(t=>t.photo);
  if(!shot.length) return null;
  const now=new Date(), id=now.toISOString();
  const walk={
    id, ts:now.getTime(),
    date:`${now.getFullYear()}.${p2(now.getMonth()+1)}.${p2(now.getDate())}`,
    summary:"", shots:[]
  };
  try{
    for(let i=0;i<shot.length;i++){
      const t=shot[i], photoId=id+"#"+i;
      await idbPut("photos",{id:photoId,data:t.photo});
      walk.shots.push({
        round:t.round, task:t.text, reply:t.reply||"",
        thumb:await makeThumb(t.photo), photoId
      });
    }
    await idbPut("walks",walk);
    return id;
  }catch(err){
    console.warn("这趟没存下来：",err);
    return null;
  }
}

/* AI 那句收尾话晚一步才回来，回来了再补进去 */
async function saveSummary(id,text){
  if(!id||!text) return;
  try{
    const w=await idbGet("walks",id);
    if(w){ w.summary=text; await idbPut("walks",w); }
  }catch(err){ console.warn("收尾语没存上：",err); }
}

/* =========================================================
   9. 这阵子 —— 跨时间观察

   两半，性质完全不同：

   上半「数出来的」：纯本地计算，不联网、不要 key、永远准。
     「你 40 张里有 12 张是往上拍的」这种，任务名里就写着，不用 AI。

   下半「AI 看出来的」：把过去所有的任务名和 AI 当时说过的话，
     当成纯文字发过去找规律。不发图片——
     一百张图又慢又贵还超容量，而每张的点评本来就是那张照片的压缩描述。
     单张照片能说的话很有限，一百张才有话说。
   ========================================================= */
const OBS_MIN = 10;                     // 少于这个趟数，AI 说不出有意义的话

function localStats(walks){
  const shots = walks.flatMap(w=>w.shots);
  const sorted = walks.slice().sort((a,b)=>a.ts-b.ts);
  const freq = {};
  shots.forEach(x=>freq[x.task]=(freq[x.task]||0)+1);
  const top = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  const hits = re => shots.filter(x=>re.test(x.task)).length;
  let poolSize = 0;
  try{ poolSize = ROUNDS.reduce((n,r)=>n+(POOL[r]||[]).length, 0); }catch{}
  return {
    walks: walks.length,
    shots: shots.length,
    from: sorted[0].date, to: sorted[sorted.length-1].date,
    kinds: Object.keys(freq).length, poolSize,
    top,
    up:   hits(/抬头|头顶|上方/),
    down: hits(/蹲|地面|底下|虫子/),
    back: hits(/回头|转一圈|后退/),
    withReply: shots.filter(x=>x.reply).length
  };
}

const row=(k,v)=>`<div class="obs-fact"><span>${k}</span><b>${v}</b></div>`;

function renderNumbers(walks){
  const t = localStats(walks);
  let h = `<div class="obs-block"><p class="obs-h">数出来的</p>`
    + row("走过", t.walks + " 趟")
    + row("拍了", t.shots + " 张")
    + row("从", t.from + " 到 " + t.to)
    + row("做过不同的任务", t.kinds + (t.poolSize ? " / " + t.poolSize : "") + " 个");
  if(t.top && t.top[1] > 1) h += row("最常撞上", t.top[1] + " 次");
  if(t.up)   h += row("抬头往上拍", t.up + " 张");
  if(t.down) h += row("蹲下来拍",   t.down + " 张");
  if(t.back) h += row("回头 / 转身", t.back + " 张");

  if(t.top && t.top[1] > 1)
    h += `<p class="obs-note">最常撞上的那个任务是「${esc(t.top[0])}」。</p>`;
  if(t.withReply < t.shots)
    h += `<p class="obs-note">${t.shots - t.withReply} 张没有点评——那几趟没填 key。
          下面那半要靠这些话才有东西可看。</p>`;
  return h + `</div>`;
}

/* ---------- AI 那半 ---------- */
const OBSERVE_VOICE = VOICE + `

现在情况变了：这不是一张照片，是他这段时间所有的散步记录。
每一行是一张照片：当时的任务，和你当时说过的话。

横着看完，说三条他自己不会注意到的规律。可以是：
- 他反复在拍的东西
- 他明显躲开的东西
- 前后期的变化
- 他挑对象的口味

每条一到两句，最多 40 字，每条单独一行，不要编号。
还是那个损朋友的语气，但这次可以稍微认真一点——他攒了这么久，值得你说点真的。

不许：三条说的其实是同一件事、硬凑规律、复述他拍过什么、感慨时间过得真快。
实在只找得出两条，就说两条，别凑。`;

function askObserve(walks){
  const body = walks.slice().sort((a,b)=>a.ts-b.ts).map(w =>
    w.date + "\n" + w.shots.map(x =>
      `  [${x.round}] 任务「${x.task}」，你当时说：${x.reply || "（那天没点评）"}`
    ).join("\n")
  ).join("\n\n");
  return callAI({
    model:PROVIDERS[provider].model, max_tokens:1000, system:OBSERVE_VOICE,
    messages:[{role:"user",content:body}]
  });
}

async function runObserve(walks){
  const box = S("obsAI");
  box.innerHTML = `<p class="obs-h">正在横着看这 ${walks.length} 趟……</p>`;
  try{
    const text = await askObserve(walks);
    await idbPut("meta",{id:"observe", text, ts:Date.now(), n:walks.length}).catch(()=>{});
    renderObserveAI(walks, {text, ts:Date.now(), n:walks.length});
  }catch(err){
    box.innerHTML = `<p class="obs-h">AI 看出来的</p>
      <p class="obs-lock">没看成（${esc(err.message)}）。</p>`
      + `<button class="ghost obs-btn" id="btnObsGo">再试一次</button>`;
    S("btnObsGo").onclick = ()=>runObserve(walks);
  }
}

function renderObserveAI(walks, saved){
  const box = S("obsAI");
  const enough = walks.length >= OBS_MIN;
  let h = `<p class="obs-h">AI 看出来的</p>`;

  if(saved && saved.text){
    h += saved.text.split(/\n+/).filter(x=>x.trim())
           .map(x=>`<p class="line">${esc(x.trim())}</p>`).join("");
    const d = new Date(saved.ts);
    h += `<p class="obs-when">基于 ${saved.n} 趟 · ${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} 生成</p>`;
    if(walks.length > saved.n)
      h += `<button class="ghost obs-btn" id="btnObsGo">这之后又走了 ${walks.length - saved.n} 趟，重新看一次</button>`;
    else
      h += `<button class="ghost obs-btn" id="btnObsGo">重新看一次</button>`;
  }else if(!enough){
    h += `<p class="obs-lock">再走 ${OBS_MIN - walks.length} 趟就能看。<br><br>
      单张照片能说的话很有限，攒够了横着看才有东西。
      现在就让它说，只会硬凑。</p>`;
  }else if(!apiKey){
    h += `<p class="obs-lock">这一半要联网问 AI，得先在首页填上 key。<br><br>
      上面「数出来的」那半永远不用 key。</p>`;
  }else{
    h += `<p class="obs-lock">攒够了。让 AI 把这 ${walks.length} 趟横着看一遍，
      找出你自己不会注意到的规律。</p>
      <button class="solid obs-btn" id="btnObsGo">看看这阵子</button>`;
  }
  box.innerHTML = h;
  const b = S("btnObsGo");
  if(b) b.onclick = ()=>runObserve(walks);
}

async function openObserve(){
  let walks = [];
  try{ walks = await idbAll("walks"); }catch{}
  if(!walks.length) return;
  S("obsNumbers").innerHTML = renderNumbers(walks);
  let saved = null;
  try{ saved = await idbGet("meta","observe"); }catch{}
  renderObserveAI(walks, saved);
  show("observe");
  S("observe").scrollTop = 0;
}

/* ---------- 某一趟 ---------- */
let openId=null;

async function openWalk(id){
  let w;
  try{ w=await idbGet("walks",id); }catch{ return; }
  if(!w) return;
  openId=id;
  S("detDate").textContent=w.date;
  S("detRows").innerHTML=w.shots.map((x,i)=>`
    <div class="det-shot">
      <div class="shot-wrap"><img id="det${i}" src="${x.thumb||""}" alt=""></div>
      <span class="t">${esc(x.round)} — ${esc(x.task)}</span>
      ${x.reply?`<p class="reply">${esc(x.reply)}</p>`:""}
    </div>`).join("");
  const sum=S("detSum");
  sum.textContent=w.summary||"";
  sum.style.display=w.summary?"":"none";
  show("walkDetail");
  S("walkDetail").scrollTop=0;

  /* 先用缩略图把版式撑起来，大图后到 —— 不卡住这一屏 */
  w.shots.forEach(async (x,i)=>{
    try{
      const ph=await idbGet("photos",x.photoId);
      const el=S("det"+i);
      if(el&&ph&&ph.data) el.src=ph.data;
    }catch{}
  });
}

async function deleteWalk(id){
  try{
    const w=await idbGet("walks",id);
    if(w) for(const x of w.shots) await idbDel("photos",x.photoId);
    await idbDel("walks",id);
  }catch(err){ console.warn("没删掉：",err); }
}

/* =========================================================
   10. 备份 / 恢复

   照片只在这台设备上。Safari 对一阵子没访问的站点会回收本地数据，
   换手机、清缓存也一样。导出一个文件是唯一的保险。
   （把网页「添加到主屏幕」能大幅降低被回收的概率，但不是保证。）
   ========================================================= */
async function exportAll(){
  const [walks,photos,meta] = await Promise.all([
    idbAll("walks"), idbAll("photos"), idbAll("meta").catch(()=>[])
  ]);
  if(!walks.length) throw new Error("还没有东西可以备份");
  const blob = new Blob(
    [JSON.stringify({app:"walkapp", v:1, at:new Date().toISOString(), walks, photos, meta})],
    {type:"application/json"});
  const d = new Date();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `散步备份-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 8000);
  return blob.size;
}

async function importAll(file){
  const d = JSON.parse(await file.text());
  if(!d || d.app!=="walkapp" || !Array.isArray(d.walks))
    throw new Error("这不像是散步的备份文件");
  /* 用 put 而不是清空重写：恢复是合并，不会把现在已有的趟数弄丢 */
  for(const w of d.walks)          await idbPut("walks", w);
  for(const x of (d.photos||[]))   await idbPut("photos", x);
  for(const m of (d.meta||[]))     await idbPut("meta", m);
  return d.walks.length;
}

const mb = n => (n/1048576).toFixed(1) + " MB";

  const b=S("btnImport"); b.disabled=true; b.textContent="正在读……";
  try{

    renderArchive();
  }catch(err){ b.textContent="恢复失败："+err.message; }
  finally{ b.disabled=false; setTimeout(()=>b.textContent="从备份恢复", 6000); }
};

S("btnDelWalk").onclick=async()=>{
  if(!openId) return;
  if(!confirm("删掉这趟？照片一起删，删了找不回来。")) return;
  await deleteWalk(openId);

};
